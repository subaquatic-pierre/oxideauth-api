  #   networks:
  #     - ironstone_net # Use the explicit network name defined below

  postgres:
    container_name: ironstone-postgres
    image: postgres:16
    environment:
      POSTGRES_DB: dev_db
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: password
      PGDATA: /var/lib/postgresql/data/pgdata

    ports:
      - "5432:5432"
    volumes:
      - ./data/psql:/var/lib/postgresql/data/pgdata
    restart: always
    networks:
      - ironstone_net

  redis:
    container_name: ironstone-redis
    image: redis:7-alpine
    command: redis-server --save 60 1
    ports:
      - "6379:6379"
    volumes:
      - ./data/redis:/data # Store Redis data persistently
    restart: always
    networks:
      - ironstone_net

# Define the networks section
networks:
  ironstone_net: # The corrected network definition name
    driver: bridge
