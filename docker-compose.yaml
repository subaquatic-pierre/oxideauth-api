version: "3.8"

services:
  postgres:
    # Use 'build' to reference your custom Dockerfile
    build:
      context: . # Use the current directory as the build context
      dockerfile: Dockerfile.psq
    environment:
      POSTGRES_DB: test_db
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: password

    ports:
      - "5432:5432"
    volumes:
      - ./data/db:/var/lib/postgresql/data #

